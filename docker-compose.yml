version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: savartourlover_app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env.production
    volumes:
      # Persistent local database storage
      - ./data_storage:/app/.data
